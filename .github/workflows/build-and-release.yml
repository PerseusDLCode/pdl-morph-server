name: Build and Push to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------- #
      # 1. SOURCE
      # ---------------------------------------------------------- #
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          # canonical-greekLit / canonical-latinLit are walked by the
          # aggregate step in the Dockerfile.
          submodules: true

      # ---------------------------------------------------------- #
      # 2. LOGIN TO GHCR
      # ---------------------------------------------------------- #
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------- #
      # 3. DOCKER BUILD & PUSH
      # ---------------------------------------------------------- #
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/perseusdlcode/pdl-morph-server:dev-latest
            ghcr.io/perseusdlcode/pdl-morph-server:dev-${{ github.run_id }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------- #
      # 4. PUBLISH morph.db AS A STANDALONE OCI ARTIFACT
      #
      #   ghcr.io/perseusdlcode/morph-db:<sha256 of morph.db, 32 hex>
      #   ghcr.io/perseusdlcode/morph-db:latest
      #
      # Tagged by content, not commit, so consumers (mvp-tokenization's
      # build-search-index.yml) only see a new version when the database
      # itself changes -- frontend-only commits leave it untouched. Stage
      # 1 comes from the gha cache populated by the build above unless
      # clojure/ or data/ changed, so this re-exports a byte-identical
      # file in that case.
      # ---------------------------------------------------------- #
      - name: Export morph.db
        uses: docker/build-push-action@v7
        with:
          context: .
          target: db-export
          outputs: type=local,dest=db-out
          cache-from: type=gha

      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Push morph.db
        env:
          REPO: ghcr.io/perseusdlcode/morph-db
        run: |
          cd db-out
          tag=$(sha256sum morph.db | cut -c1-32)
          if oras manifest fetch "$REPO:$tag" >/dev/null 2>&1; then
            echo "morph.db unchanged ($tag); not re-pushing."
          else
            oras push "$REPO:$tag" \
              --artifact-type application/vnd.perseus.morph-db \
              --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
              morph.db:application/vnd.sqlite3
          fi
          oras tag "$REPO:$tag" latest
          echo "Published $REPO:$tag" >> "$GITHUB_STEP_SUMMARY"
