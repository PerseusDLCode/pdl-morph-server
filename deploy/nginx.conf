# Static file server for the client-side pdl-morph-server: serves the
# built frontend bundle and clojure/morph.db, the latter over HTTP range
# requests so sql.js-httpvfs (web/src/morph/httpVfsDb.ts) can query it
# in-browser without downloading the whole file. nginx handles byte
# ranges on static files natively -- no extra module needed.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # nginx's stock mime.types already maps .wasm -> application/wasm,
  # which WebAssembly.instantiateStreaming requires.
  include mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Permissive CORS: this static host has no notion of "session" or
    # cookies to protect, and the frontend may be served from a different
    # origin than this asset host in some deployments.
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    add_header Access-Control-Allow-Headers "Range";
    # sql.js-httpvfs needs to see Content-Length/Content-Range to know how
    # much of the file it's fetching -- explicitly exposed since CORS
    # hides response headers from JS by default beyond a small allowlist.
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";

    # The app lives entirely under /morph (see web/svelte.config.js), so a
    # reverse proxy sharing a hostname with MinimumViablePerseus needs just
    # one /morph prefix rule. Redirect the bare root for anyone hitting this
    # container's port directly; relative, so it survives a proxy.
    absolute_redirect off;

    location = / {
      return 302 /morph;
    }

    location = /morph/morph.db {
      # Range requests + gzip don't mix well (gzip would have to
      # re-encode the whole file to serve a byte range), and there's
      # nothing to gain compressing an already page-structured SQLite
      # file, so compression is left off entirely for this path.
      # (nginx already advertises Accept-Ranges: bytes for static files
      # by default -- no directive needed for that part.)
      gzip off;

      # morph.db is replaced wholesale on every deploy, but sql.js-httpvfs
      # reads it piecemeal: if a browser heuristically cached some pages
      # of the old file, it could mix them with pages of the new one and
      # read a corrupt database. no-cache still lets it reuse cached
      # ranges, but only after revalidating them (ETag) against the
      # current file.
      #
      # add_header in a location replaces, rather than extends, the
      # server-level add_headers, so the CORS headers are repeated here.
      add_header Cache-Control "no-cache";
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
      add_header Access-Control-Allow-Headers "Range";
      add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
    }

    # The SPA shell (also the try_files fallback below, which re-matches
    # this location) references content-hashed bundles under /morph/_app/,
    # so it must be revalidated for a deploy's new bundles to be picked up.
    location = /morph/index.html {
      add_header Cache-Control "no-cache";
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
      add_header Access-Control-Allow-Headers "Range";
      add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
    }

    # Exact /morph plus the /morph/ prefix, rather than a bare "/morph"
    # prefix, which would also catch unrelated paths like /morph.db or
    # /morphology. No $uri/ in try_files: /morph itself is a directory,
    # and should fall through to the SPA shell rather than to nginx's
    # directory handling.
    location = /morph {
      try_files $uri /morph/index.html;
    }

    location /morph/ {
      try_files $uri /morph/index.html;
    }

    # Health check target for deploy/compose.yaml -- 200 means nginx is up
    # and morph.db is present in the image; 503 otherwise.
    location = /healthz {
      default_type text/plain;
      if (!-f $document_root/morph/morph.db) {
        return 503 "morph.db missing";
      }
      return 200 "ok";
    }
  }
}
