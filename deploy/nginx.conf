# Static file server for the client-side pdl-morph-server: serves the
# built frontend bundle and clojure/morph.db, the latter over HTTP range
# requests so sql.js-httpvfs (web/src/morph/httpVfsDb.ts) can query it
# in-browser without downloading the whole file. nginx handles byte
# ranges on static files natively -- no extra module needed.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # nginx's stock mime.types already maps .wasm -> application/wasm,
  # which WebAssembly.instantiateStreaming requires.
  include mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Permissive CORS: this static host has no notion of "session" or
    # cookies to protect, and the frontend may be served from a different
    # origin than this asset host in some deployments.
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    add_header Access-Control-Allow-Headers "Range";
    # sql.js-httpvfs needs to see Content-Length/Content-Range to know how
    # much of the file it's fetching -- explicitly exposed since CORS
    # hides response headers from JS by default beyond a small allowlist.
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";

    location = /morph.db {
      # Range requests + gzip don't mix well (gzip would have to
      # re-encode the whole file to serve a byte range), and there's
      # nothing to gain compressing an already page-structured SQLite
      # file, so compression is left off entirely for this path.
      # (nginx already advertises Accept-Ranges: bytes for static files
      # by default -- no directive needed for that part.)
      gzip off;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Health check target for deploy/compose.yaml -- a HEAD request that
    # succeeds means nginx is up and morph.db is present and readable.
    location = /healthz {
      return 200 "ok";
      add_header Content-Type text/plain;
    }
  }
}
